spring.application.name=OMS
server.port=8080
app.scheduling.enable=false
spring.datasource.url=jdbc:mysql://localhost:3306/oms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.security.default-admin.username=admin
app.security.default-admin.password=admin123
app.security.default-admin.full-name=System Admin
oms.backorder.scheduler-delay-ms=300000
